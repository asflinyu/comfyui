<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>生图工作室</title>
<link rel="stylesheet" href="/static/layout.css?v=7">
<style>
:root{--bg:#0b0d12;--panel:#14171d;--border:#252a33;--text:#e7e9ef;--muted:#8b93a7;--accent:#4f8cff;}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;line-height:1.5}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.col{flex:1;min-width:160px}
label{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}
input,textarea,select{width:100%;background:#0d1016;border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px 10px;font-size:13px}
textarea{min-height:130px;resize:vertical;line-height:1.55}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer}
button.secondary{background:#2c313b}
button:disabled{opacity:.5;cursor:not-allowed}
.nav{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.nav a{color:var(--muted);text-decoration:none;font-size:13px}
.nav a.on{color:var(--text);font-weight:600}
.status-chip{font-size:11px;padding:3px 8px;border-radius:10px;background:#1e232c;color:var(--muted)}
.status-chip.ok{background:#1a3c2b;color:#6ce0a0}
.status-chip.err{background:#3c1a1a;color:#ff8a8a}
.hint{color:var(--muted);font-size:12px;margin:0}
.hint code{color:#c9d4ff}
.progress-bar{height:16px;background:#22262e;border-radius:8px;overflow:hidden;margin-top:10px}
.progress-fill{height:100%;width:8%;background:linear-gradient(90deg,var(--accent),#78aaff);transition:width .3s}
.log-panel{margin-top:10px;background:#0a0c10;border:1px solid var(--border);border-radius:8px;max-height:240px;overflow:auto;padding:8px;font-size:12px;display:none}
.log-time{color:var(--muted)}
img.thumb{width:100%;max-height:220px;object-fit:contain;border-radius:8px;background:#000;display:none}
.thumb{max-height:220px;object-fit:contain;margin-top:8px;display:none}
#toast{position:fixed;bottom:14px;right:14px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:9px 14px;display:none;z-index:9999;font-size:13px}
.spinner{width:14px;height:14px;border:2px solid var(--muted);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body class="tiled">
<div class="shell">
  <header class="chrome">
  <div class="nav">
    <a href="/">入口</a><span style="color:#333">|</span>
    <a class="on" href="/t2i">生图</a><span style="color:#333">|</span>
    <a href="/i2v">I2V</a><span style="color:#333">|</span>
    <a href="/t2v">T2V</a><span style="color:#333">|</span>
    <a href="/s2v">S2V</a><span style="color:#333">|</span>
    <a href="/talking">口播</a><span style="color:#333">|</span>
    <a href="/talking-video">视频数字人</a><span style="color:#333">|</span>
    <a href="/f2v">F2V</a><span style="color:#333">|</span>
    <a href="/console">分镜控制台</a>
    <span id="sys" style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap"></span>
  </div>
  <h2>生图工作室</h2>
  <p class="hint" id="lead">多种真实 Comfy 工作流：文生图、图生图、放大。选工作流后才会改模型和节点图。</p>
  </header>
  <div class="workspace">
  <section class="pane-form">

  <div class="card">
    <div class="row">
      <div class="col" style="min-width:240px"><label>工作流 / 模型</label><select id="wfSel"></select></div>
      <div class="col"><label>Seed（空=随机）</label><input id="seedInp" type="number" placeholder="随机" /></div>
      <div class="col"><label>数量</label>
        <select id="countSel">
          <option value="1" selected>1 张</option>
          <option value="2">2 张</option>
          <option value="3">3 张</option>
          <option value="4">4 张</option>
        </select>
      </div>
      <div class="col"><label>Denoise（仅图生图）</label><input id="denoiseInp" type="number" min="0.1" max="1" step="0.05" value="0.65" /></div>
    </div>
    <p class="hint" id="wfHint" style="margin-top:8px"></p>
  </div>

  <div class="card" id="imgCard">
    <label>底图（图生图 / 放大必填）</label>
    <input id="imgFile" type="file" accept="image/*" />
    <p class="hint" id="imgMeta" style="margin-top:6px">还没选图。</p>
    <img id="imgPrev" class="thumb" alt="底图预览" />
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:flex-end;margin-bottom:6px">
      <label style="margin:0">提示词</label>
      <button type="button" id="exBtn" class="secondary">填入示例</button>
    </div>
    <textarea id="imgArea" placeholder="描述你要的画面，或图生图时写要改什么"></textarea>
    <div style="margin-top:10px">
      <label>负向提示词</label>
      <textarea id="negArea" style="min-height:72px">cartoon, extra people, extra limbs, text, watermark, blurry, lowres, extra heads</textarea>
    </div>
    <div class="row" style="margin-top:12px">
      <button id="genBtn" style="font-size:15px;padding:10px 18px">生成图片</button>
      <span class="hint">点了才会占 GPU。这里不会自动出视频。</span>
    </div>
    <div id="progressWrap" style="display:none">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="hint" id="progressMeta" style="margin-top:6px"></div>
    </div>
    <div class="log-panel" id="logPanel"></div>
  </div>
  </section>
  <section class="pane-preview">
  <div class="card fill-card" id="resultCard">
    <h3 style="margin:0 0 10px">结果</h3>
    <div class="stage" id="resultStage">
      <div class="img-gallery" id="outGallery" hidden></div>
      <img id="outImg" alt="still" />
      <span class="empty-stage" id="emptyHint">生成结果会铺满这里</span>
    </div>
    <p class="hint" id="outMeta" style="margin-top:8px">多张时点选一张，再去 I2V 或当底图。</p>
    <div class="row" style="margin-top:10px">
      <button id="toI2vBtn" class="secondary">用这张图去 I2V 视频</button>
      <button id="asSrcBtn" class="secondary">当作下一张底图</button>
    </div>
  </div>
  </section>
  </div>
</div>
<div id="toast"></div>
<script>
const EXAMPLE = `photorealistic cinematic still, vertical 9:16, one adult Chinese woman looking at camera, warm light, sharp skin texture, one person only`;
const $ = id => document.getElementById(id);
let workflows = [];
let imageName = '';
let lastImage = '';
let lastImages = [];
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2400)}
function chip(text, ok){const s=document.createElement('span');s.className='status-chip '+(ok===false?'err':ok?'ok':'');s.textContent=text;return s}
async function jget(u){const r=await fetch(u);const d=await r.json().catch(()=>({}));if(!r.ok) throw new Error(d.detail||d.error||r.statusText);return d}
async function jpost(u,b){const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const d=await r.json().catch(()=>({}));if(!r.ok) throw new Error(typeof d.detail==='string'?d.detail:(d.error||JSON.stringify(d.detail)||r.statusText));return d}
function currentWf(){return workflows.find(w=>w.id===$('wfSel').value)||workflows[0]||{}}
function applyWf(){
  const w=currentWf();
  $('wfHint').textContent=(w.desc||'')+' · 默认 '+(w.width||'?')+'×'+(w.height||'?')+' · '+(w.kind==='i2i'?'图生图':'文生图');
  $('imgCard').style.display=w.needs_image?'block':'none';
  $('denoiseInp').disabled=!w.needs_image || w.id==='upscale';
  $('countSel').disabled=w.id==='upscale';
  if(w.id==='upscale') $('countSel').value='1';
}
function renderGallery(names){
  lastImages=names.filter(Boolean);
  lastImage=lastImages[0]||'';
  const g=$('outGallery');
  const eh=$('emptyHint');
  const single=$('outImg');
  g.innerHTML='';
  if(!lastImages.length){
    g.hidden=true;
    if(single){ single.removeAttribute('src'); single.style.display='none'; }
    if(eh) eh.style.display='';
    return;
  }
  g.hidden=false;
  g.dataset.n=String(lastImages.length);
  if(eh) eh.style.display='none';
  if(single) single.style.display='none';
  lastImages.forEach((name,i)=>{
    const fig=document.createElement('figure');
    if(i===0) fig.className='on';
    const im=document.createElement('img');
    im.alt='结果 '+(i+1);
    im.src='/files/'+encodeURIComponent(name)+'?t='+Date.now();
    const cap=document.createElement('figcaption');
    cap.textContent=(i+1)+' / '+lastImages.length;
    fig.appendChild(im); fig.appendChild(cap);
    fig.onclick=()=>{
      lastImage=name;
      g.querySelectorAll('figure').forEach(x=>x.classList.remove('on'));
      fig.classList.add('on');
    };
    g.appendChild(fig);
  });
}
function showImage(name){
  imageName=name;
  $('imgMeta').textContent='当前底图：'+name;
  $('imgPrev').src='/files/'+encodeURIComponent(name)+'?t='+Date.now();
  $('imgPrev').style.display='block';
}
$('exBtn').onclick=()=>{$('imgArea').value=EXAMPLE}
$('wfSel').onchange=applyWf;
async function boot(){
  try{
    const h=await jget('/api/health'); const box=$('sys'); box.innerHTML='';
    box.appendChild(chip('Comfy '+(h.comfy||''), h.comfy==='ok'));
    const gpu=h.gpu||{}; box.appendChild(chip((gpu.name||'GPU')+' '+(gpu.vram_gb||'?')+'GB', true));
    box.appendChild(chip('生图工作室', true));
  }catch(e){$('sys').appendChild(chip('控制台离线', false))}
  const data=await jget('/api/image/workflows');
  workflows=data.workflows||[];
  const want=new URLSearchParams(location.search).get('wf')||'flux_dev';
  $('wfSel').innerHTML=workflows.map(w=>`<option value="${w.id}">${w.kind==='i2i'?'图生图':'文生图'} · ${w.label}</option>`).join('');
  if(workflows.some(w=>w.id===want)) $('wfSel').value=want;
  applyWf();
  const qImg=new URLSearchParams(location.search).get('image');
  if(qImg) showImage(qImg);
}
$('imgFile').onchange=async()=>{
  const f=$('imgFile').files[0]; if(!f) return;
  const fd=new FormData(); fd.append('files', f); fd.append('shot_index','0'); fd.append('project_id','img');
  try{
    const r=await fetch('/api/upload/image',{method:'POST',body:fd}); const d=await r.json();
    const ok=(d.results||[])[0]; if(!ok) throw new Error(d.error||'上传失败');
    showImage(ok.image_name); toast('底图已上传');
  }catch(e){toast('图片上传失败: '+e.message)}
};
$('genBtn').onclick=async()=>{
  const w=currentWf();
  if(w.needs_image && !imageName){toast('这个工作流要先上传底图');return}
  if(w.id!=='upscale' && !$('imgArea').value.trim()){toast('先写提示词');return}
  $('genBtn').disabled=true;
  $('progressWrap').style.display='block'; $('logPanel').style.display='block'; $('logPanel').innerHTML='';
  $('progressFill').style.width='6%'; $('progressMeta').innerHTML='<span class="spinner"></span>提交生图…';
  try{
    poll((await jpost('/api/t2i/generate',{
      workflow:w.id,
      prompt:$('imgArea').value.trim(),
      negative:$('negArea').value.trim(),
      image_name:imageName,
      denoise:+$('denoiseInp').value||0.65,
      width:w.width||null,
      height:w.height||null,
      seed:$('seedInp').value?+$('seedInp').value:null,
      count:+$('countSel').value||1
    })).task_id);
  }catch(e){$('genBtn').disabled=false;$('progressMeta').textContent='提交失败: '+e.message;toast('提交失败')}
};
function addLog(entry){const p=$('logPanel'); const d=document.createElement('div'); d.innerHTML='<span class="log-time">'+(entry.ts||'').slice(11,19)+'</span> '+(entry.message||''); p.appendChild(d); p.scrollTop=p.scrollHeight}
async function poll(tid){
  const t0=Date.now();
  const timer=setInterval(async()=>{
    try{
      const s=await jget('/api/generate/status/'+tid);
      const elapsed=Math.floor((Date.now()-t0)/1000);
      $('logPanel').innerHTML=''; (s.logs||[]).forEach(addLog);
      if(s.status==='done'){
        clearInterval(timer); $('progressFill').style.width='100%'; $('progressMeta').textContent='完成，用时 '+elapsed+'s'; $('genBtn').disabled=false;
        const rec=(s.results||[])[0]||{};
        const names=rec.images&&rec.images.length?rec.images:(rec.image?[rec.image]:[]);
        renderGallery(names);
        $('outMeta').textContent=(rec.workflow||'')+' · '+names.length+' 张'+(names.length>1?'（点选一张）':'')+(lastImage?' · '+lastImage:'');
        return;
      }
      if(s.status==='error'){clearInterval(timer); $('progressMeta').textContent=s.message||'失败'; $('genBtn').disabled=false; return}
      $('progressFill').style.width=Math.min(92, 6+(s.progress||elapsed/3))+'%';
      $('progressMeta').innerHTML='<span class="spinner"></span>'+(s.message||'生成中')+' · '+elapsed+'s';
    }catch(e){$('progressMeta').textContent='状态读取失败: '+e.message}
  },1500);
}
$('toI2vBtn').onclick=()=>{ if(!lastImage){toast('还没有图');return} location.href='/i2v?image='+encodeURIComponent(lastImage) }
$('asSrcBtn').onclick=()=>{ if(!lastImage){toast('还没有图');return} showImage(lastImage); toast('已设为底图，可换图生图工作流') }
boot();
</script>
</body>
</html>
